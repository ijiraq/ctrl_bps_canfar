# Example BPS site stanza for CANFAR. Merge into your submit YAML.
wmsServiceClass: lsst.ctrl.bps.canfar.CanfarService
computeSite: canfar
# submitPath must be on /arc (or other storage mounted in headless workers)
# submitPath: /arc/projects/MyProject/bps/{outdir}

site:
  canfar:
    image: images.canfar.net/lsst/sciplat-lab:latest
    nWorkers: 1
    cores: 1
    ram: 4
    idleTimeout: 86900
    pollInterval: 30
    replaceWorkers: true
    reclaimGraceSeconds: 120
    stallCpuFraction: 0.01
    stallPolls: 5
    httpTimeout: 120
    httpRetries: 3
    # Script the workers source for the project environment (path as seen by
    # the worker). Without it they load the image's stack only.
    # envScript: /arc/projects/MyProject/env.sh
